# Railway monorepo configuration for sector2-infra
# Each service has its own [[services]] block.
# Railway auto-detects multi-service monorepos from this single railway.toml.

# ============================================================================
# Service: superset
# ============================================================================
[[services]]
name = "superset"
dockerfilePath = "services/superset/Dockerfile"

[services.deploy]
startCommand = "./superset_init.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.deploy.volumes]
mountPath = "/app/superset_home"
name = "superset-data"

# Required environment variables (set in Railway Variables UI)
[services.deploy.env]
ADMIN_USERNAME = "${{ secrets.ADMIN_USERNAME }}"
ADMIN_EMAIL = "${{ secrets.ADMIN_EMAIL }}"
ADMIN_PASSWORD = "${{ secrets.ADMIN_PASSWORD }}"
SECRET_KEY = "${{ secrets.SECRET_KEY }}"
SUPERSET_SECRET_KEY = "${{ secrets.SUPERSET_SECRET_KEY }}"
SQLALCHEMY_DATABASE_URI = "${{ secrets.POSTGRES_URL }}"
REDIS_URL = "${{ secrets.REDIS_URL }}"
# Service references
TRINO_HOST = "sector2-trino.railway.internal"
TRINO_PORT = "8080"

# ============================================================================
# Service: sector2-trino
# ============================================================================
# Trino 435 with Iceberg REST catalog backed by Cloudflare R2 Data Catalog.
# Env vars are substituted at runtime by the startCommand bash script.
# Token NEVER touches git - stays in Railway Variables only.
[[services]]
name = "sector2-trino"
dockerfilePath = "Dockerfile"

[services.deploy]
# Bash command that substitutes env vars in catalog configs, then runs Trino.
# - Copies catalog configs to /tmp/cfg/catalog (writable dir)
# - Substitutes __PLACEHOLDER__ with Railway env vars
# - Runs Trino launcher with --etc-dir pointing to substituted configs
startCommand = "bash -c 'mkdir -p /tmp/cfg/catalog && cp /etc/trino/catalog/*.properties /tmp/cfg/catalog/ && for f in /tmp/cfg/catalog/*.properties; do sed -i -e \"s|__R2_ICEBERG_REST_URI__|${R2_ICEBERG_REST_URI:-}|g\" -e \"s|__R2_ICEBERG_WAREHOUSE__|${R2_ICEBERG_WAREHOUSE:-}|g\" -e \"s|__R2_CATALOG_TOKEN__|${R2_CATALOG_TOKEN:-}|g\" -e \"s|__R2_ACCESS_KEY__|${R2_ACCESS_KEY:-}|g\" -e \"s|__R2_SECRET_KEY__|${R2_SECRET_KEY:-}|g\" -e \"s|__R2_S3_ENDPOINT__|${R2_S3_ENDPOINT:-}|g\" -e \"s|__CLICKHOUSE_HOST__|${CLICKHOUSE_HOST:-}|g\" -e \"s|__CLICKHOUSE_PORT__|${CLICKHOUSE_PORT:-}|g\" -e \"s|__CLICKHOUSE_USER__|${CLICKHOUSE_USER:-}|g\" -e \"s|__CLICKHOUSE_PASSWORD__|${CLICKHOUSE_PASSWORD:-}|g\" $f; done && exec /usr/lib/trino/bin/launcher run --etc-dir /tmp/cfg'"
healthcheckPath = "/v1/info"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables (tokens stored only in Railway Variables - never in git)
[services.deploy.env]
R2_ICEBERG_REST_URI = "${{ secrets.R2_ICEBERG_REST_URI }}"
R2_ICEBERG_WAREHOUSE = "${{ secrets.R2_ICEBERG_WAREHOUSE }}"
R2_CATALOG_TOKEN = "${{ secrets.R2_CATALOG_TOKEN }}"
R2_ACCESS_KEY = "${{ secrets.R2_ACCESS_KEY }}"
R2_SECRET_KEY = "${{ secrets.R2_SECRET_KEY }}"
R2_S3_ENDPOINT = "${{ secrets.R2_S3_ENDPOINT }}"
CLICKHOUSE_HOST = "${{ secrets.CLICKHOUSE_HOST }}"
CLICKHOUSE_PORT = "${{ secrets.CLICKHOUSE_PORT }}"
CLICKHOUSE_USER = "${{ secrets.CLICKHOUSE_USER }}"
CLICKHOUSE_PASSWORD = "${{ secrets.CLICKHOUSE_PASSWORD }}"
