# Railway monorepo configuration for sector2-infra
# Each service has its own [[services]] block with its own Dockerfile.
# Railway auto-detects multi-service monorepos from this single railway.toml.

# ============================================================================
# Service: superset
# ============================================================================
# Existing Apache Superset deployment (refactored from apache-superset-railway)
# Status: Live on Railway, accessible at apache-superset-railway-production-13fe.up.railway.app
[[services]]
name = "superset"
dockerfilePath = "services/superset/Dockerfile"

[services.deploy]
startCommand = "./superset_init.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.deploy.volumes]
mountPath = "/app/superset_home"
name = "superset-data"

# Required environment variables (set in Railway Variables UI)
[services.deploy.env]
ADMIN_USERNAME = "${{ secrets.ADMIN_USERNAME }}"
ADMIN_EMAIL = "${{ secrets.ADMIN_EMAIL }}"
ADMIN_PASSWORD = "${{ secrets.ADMIN_PASSWORD }}"
SECRET_KEY = "${{ secrets.SECRET_KEY }}"
SUPERSET_SECRET_KEY = "${{ secrets.SUPERSET_SECRET_KEY }}"
SQLALCHEMY_DATABASE_URI = "${{ secrets.POSTGRES_URL }}"
# Optional
REDIS_URL = "${{ secrets.REDIS_URL }}"
# Service references
TRINO_HOST = "sector2-trino.railway.internal"
TRINO_PORT = "8080"

# ============================================================================
# Service: sector2-trino
# ============================================================================
# Uses Railway env vars for runtime config substitution.
# Trino's default launcher (startCommand) calls /usr/lib/trino/bin/launcher run
# which reads /etc/trino/catalog/*.properties. Our startCommand first runs
# services/trino/run-trino.sh which substitutes placeholders with env vars.
[[services]]
name = "sector2-trino"
dockerfilePath = "Dockerfile"

[services.deploy]
# Bash command that substitutes env vars in catalog configs, then runs Trino.
# Uses `bash -c` to chain: substitute env vars + exec launcher.
# The catalog-config-dir flag points to a writable dir with substituted configs.
startCommand = "bash -c 'mkdir -p /tmp/cfg && cp /etc/trino/catalog/*.properties /tmp/cfg/ && for f in /tmp/cfg/*.properties; do sed -i -e s|__R2_ICEBERG_REST_URI__|${R2_ICEBERG_REST_URI:-}|g -e s|__R2_CATALOG_WAREHOUSE__|${R2_ICEBERG_WAREHOUSE:-}|g -e s|__R2_CATALOG_TOKEN__|${R2_CATALOG_TOKEN:-}|g -e s|__R2_ACCESS_KEY__|${R2_ACCESS_KEY:-}|g -e s|__R2_SECRET_KEY__|${R2_SECRET_KEY:-}|g -e s|__R2_S3_ENDPOINT__|${R2_S3_ENDPOINT:-}|g $f; done && exec /usr/lib/trino/bin/launcher run --catalog-config-dir /tmp/cfg'"
healthcheckPath = "/v1/info"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.deploy.env]
# R2 Data Catalog - tokens stay in Railway Variables, never in git
R2_ICEBERG_REST_URI = "${{ secrets.R2_ICEBERG_REST_URI }}"
R2_ICEBERG_WAREHOUSE = "${{ secrets.R2_ICEBERG_WAREHOUSE }}"
R2_CATALOG_TOKEN = "${{ secrets.R2_CATALOG_TOKEN }}"
R2_ACCESS_KEY = "${{ secrets.R2_ACCESS_KEY }}"
R2_SECRET_KEY = "${{ secrets.R2_SECRET_KEY }}"
R2_S3_ENDPOINT = "${{ secrets.R2_S3_ENDPOINT }}"
# ClickHouse (legacy voter roll data)
CLICKHOUSE_HOST = "${{ secrets.CLICKHOUSE_HOST }}"
CLICKHOUSE_PORT = "${{ secrets.CLICKHOUSE_PORT }}"
CLICKHOUSE_USER = "${{ secrets.CLICKHOUSE_USER }}"
CLICKHOUSE_PASSWORD = "${{ secrets.CLICKHOUSE_PASSWORD }}"
