# ============================================================================
# Notes on PostgreSQL + Redis (NOT in this file)
# ============================================================================
# Both PostgreSQL and Redis are managed by Railway as plugins:
# - PostgreSQL plugin: stores Superset metadata
# - Redis plugin (optional): caching + rate limiting for Superset
# Provision via Railway dashboard → New → Database → PostgreSQL / Redis
# Connection strings are auto-injected as ${{ secrets.POSTGRES_URL }} and
# ${{ secrets.REDIS_URL }} for use in other services.