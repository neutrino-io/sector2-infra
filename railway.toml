# Railway monorepo configuration for sector2-infra
# Each service has its own [[services]] block with its own Dockerfile.
# Railway auto-detects multi-service monorepos from this single railway.toml.

# ============================================================================
# Service: superset
# ============================================================================
# Existing Apache Superset deployment (refactored from apache-superset-railway)
# Status: Live on Railway, accessible at apache-superset-railway-production-13fe.up.railway.app
[[services]]
name = "superset"
dockerfilePath = "services/superset/Dockerfile"

[services.deploy]
startCommand = "./superset_init.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.deploy.volumes]
mountPath = "/app/superset_home"
name = "superset-data"

# Required environment variables (set in Railway Variables UI)
[services.deploy.env]
ADMIN_USERNAME = "${{ secrets.ADMIN_USERNAME }}"
ADMIN_EMAIL = "${{ secrets.ADMIN_EMAIL }}"
ADMIN_PASSWORD = "${{ secrets.ADMIN_PASSWORD }}"
SECRET_KEY = "${{ secrets.SECRET_KEY }}"
SUPERSET_SECRET_KEY = "${{ secrets.SUPERSET_SECRET_KEY }}"
SQLALCHEMY_DATABASE_URI = "${{ secrets.POSTGRES_URL }}"
# Optional
REDIS_URL = "${{ secrets.REDIS_URL }}"
# Service references
TRINO_HOST = "sector2-trino.railway.internal"
TRINO_PORT = "8080"

# ============================================================================
# Service: sector2-trino  (NEW — Phase 1 BI tier requirement)
# ============================================================================
# Status: NOT YET DEPLOYED on Railway. Owner action required.
[[services]]
name = "sector2-trino"
dockerfilePath = "services/trino/Dockerfile"

[services.deploy]
startCommand = "./trino_init.sh"
healthcheckPath = "/v1/info"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

[services.deploy.env]
R2_ICEBERG_REST_URI = "https://catalog.cloudflarestorage.com/203a605533f37eb35da80dcf03a7bed6/gyhc40sdz8-ivj8v3841x-bronze-storage"
R2_CATALOG_TOKEN = "${{ secrets.R2_CATALOG_TOKEN }}"
R2_ACCESS_KEY = "${{ secrets.R2_ACCESS_KEY }}"
R2_SECRET_KEY = "${{ secrets.R2_SECRET_KEY }}"
R2_S3_ENDPOINT = "https://203a605533f37eb35da80dcf03a7bed6.r2.cloudflarestorage.com"
CLICKHOUSE_HOST = "${{ secrets.CLICKHOUSE_HOST }}"
CLICKHOUSE_PORT = "${{ secrets.CLICKHOUSE_PORT }}"
CLICKHOUSE_USER = "${{ secrets.CLICKHOUSE_USER }}"
CLICKHOUSE_PASSWORD = "${{ secrets.CLICKHOUSE_PASSWORD }}"

# ============================================================================
# Notes on PostgreSQL + Redis (NOT in this file)
# ============================================================================
# Both PostgreSQL and Redis are managed by Railway as plugins:
# - PostgreSQL plugin: stores Superset metadata
# - Redis plugin (optional): caching + rate limiting for Superset
# Provision via Railway dashboard → New → Database → PostgreSQL / Redis
# Connection strings are auto-injected as ${{ secrets.POSTGRES_URL }} and
# ${{ secrets.REDIS_URL }} for use in other services.