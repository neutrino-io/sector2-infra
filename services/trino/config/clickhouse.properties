# Trino ClickHouse catalog — legacy voter roll data
# Read-only access to existing ClickHouse instance on Railway
#
# Connection: clickhouse-jdbc via Trino's clickhouse connector
# Auth: HTTP basic auth (default user)

connector.name=clickhouse

connection-url=jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT:-9000}/sector2
connection-user=${CLICKHOUSE_USER:-default}
connection-password=${CLICKHOUSE_PASSWORD}

# Performance
clickhouse.split-by-distribution=true
clickhouse.tuple-serializer=JSONCompactEachRow