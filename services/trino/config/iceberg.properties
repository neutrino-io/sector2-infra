connector.name=iceberg

# R2 Configuration (S3 filesystem for Iceberg data files).
# S3 creds still needed for direct file access; R2 Data Catalog also vends SigV4 creds.
# ALL secrets injected via ${VAR} from Railway Variables — never commit secrets.
fs.native-s3.enabled=true
s3.region=auto
s3.aws-access-key=${R2_ACCESS_KEY}
s3.aws-secret-key=${R2_SECRET_KEY}
s3.endpoint=https://203a605533f37eb35da80dcf03a7bed6.r2.cloudflarestorage.com
s3.path-style-access=true

# R2 Data Catalog Configuration (warehouse=accountId_bucketName)
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=https://catalog.cloudflarestorage.com/203a605533f37eb35da80dcf03a7bed6/gyhc40sdz8-ivj8v3841x-bronze-storage
iceberg.rest-catalog.warehouse=203a605533f37eb35da80dcf03a7bed6_gyhc40sdz8-ivj8v3841x-bronze-storage
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${R2_CATALOG_TOKEN}
iceberg.rest-catalog.vended-credentials-enabled=true
