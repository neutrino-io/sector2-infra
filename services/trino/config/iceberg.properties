connector.name=iceberg

# Iceberg REST catalog (Cloudflare R2 Data Catalog)
# Secrets injected at runtime via startCommand substitution
iceberg.catalog.type=rest
iceberg.rest.uri=__R2_ICEBERG_REST_URI__
iceberg.rest.auth.type=BEARER
iceberg.rest.auth.token=__R2_CATALOG_TOKEN__

# S3 endpoint (Cloudflare R2 native)
fs.native-s3.enabled=true
s3.endpoint=__R2_S3_ENDPOINT__
s3.access-key=__R2_ACCESS_KEY__
s3.secret-key=__R2_SECRET_KEY__
s3.region=auto
s3.path-style-access=true
