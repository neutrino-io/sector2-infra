# Trino Iceberg REST catalog — points at Cloudflare R2 Data Catalog
# Iceberg REST API for namespace/table management
# S3 for actual data file reads/writes
#
# Auth: Bearer token = R2 Catalog Token (NOT Access Key)
# Get from: Cloudflare Dashboard → R2 → API tokens → Create (Admin Read & Write template)

connector.name=iceberg

# Catalog REST endpoint
iceberg.catalog.type=rest
iceberg.rest.uri=${R2_ICEBERG_REST_URI}
iceberg.rest.auth.type=bearer
iceberg.rest.auth.token=${R2_CATALOG_TOKEN}
iceberg.rest.timeout=30s

# S3 endpoint (Cloudflare R2 native)
fs.native-s3.enabled=true
s3.endpoint=${R2_S3_ENDPOINT}
s3.access-key=${R2_ACCESS_KEY}
s3.secret-key=${R2_SECRET_KEY}
s3.region=auto
s3.path-style-access=true

# Performance tuning
iceberg.split-manager-threads=8