connector.name=iceberg

# R2 Configuration (S3 filesystem for data files)
fs.native-s3.enabled=true
s3.region=auto
s3.aws-access-key=__R2_ACCESS_KEY__
s3.aws-secret-key=__R2_SECRET_KEY__
s3.endpoint=__R2_S3_ENDPOINT__
s3.path-style-access=true

# R2 Data Catalog Configuration
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=__R2_ICEBERG_REST_URI__
iceberg.rest-catalog.warehouse=__R2_ICEBERG_WAREHOUSE__
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=__R2_CATALOG_TOKEN__
