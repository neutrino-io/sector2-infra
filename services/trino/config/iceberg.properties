connector.name=iceberg

# R2 Configuration (S3 filesystem for data files)
# Trino's airlift Config class expands ${ENV_VAR} at runtime.
# Non-sensitive defaults are set via ENV in Dockerfile.
# Railway Variables override at deploy time.
fs.native-s3.enabled=true
s3.region=auto
s3.aws-access-key=${R2_ACCESS_KEY}
s3.aws-secret-key=${R2_SECRET_KEY}
s3.endpoint=${R2_S3_ENDPOINT}
s3.path-style-access=true

# R2 Data Catalog Configuration
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${R2_ICEBERG_REST_URI}
iceberg.rest-catalog.warehouse=${R2_ICEBERG_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${R2_CATALOG_TOKEN}
