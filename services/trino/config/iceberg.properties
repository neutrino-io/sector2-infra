connector.name=iceberg

# Iceberg REST catalog (Cloudflare R2 Data Catalog)
# Verified working config keys per Trino 435 Iceberg connector
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=__R2_ICEBERG_REST_URI__
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=__R2_CATALOG_TOKEN__
iceberg.rest-catalog.oauth2.token=__R2_CATALOG_TOKEN__

# S3 endpoint NOT needed in catalog config — REST catalog handles S3 auth via bearer token
# Only set these if accessing S3 directly (not needed for REST catalog)
# s3.aws-access-key=__R2_ACCESS_KEY__
# s3.aws-secret-key=__R2_SECRET_KEY__
# s3.endpoint=__R2_S3_ENDPOINT__
# s3.region=auto
# s3.path-style-access=true
